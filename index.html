<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#f8f6f2">
  <meta name="description" content="ベージュ系の通勤トートを、軽さと使いやすさで比較するデジタルカタログ。">
  <title>かわいいまま、少し軽く。通勤バッグ候補</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .thumb { height: 58px; }
    .thumb img { height: 100%; }
    .thumb-label { display: none !important; }
    .rank-row { justify-content: flex-start; }
  </style>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="hero shell">
    <p class="eyebrow">COMMUTE TOTE CATALOG</p>
    <h1>かわいいまま、<br>少し軽く。</h1>
    <p class="lead">ベージュ系の通勤トートを、軽さと使いやすさで比較。</p>
    <div class="hero-chips" aria-label="選定条件">
      <span>ベージュ系</span><span>A4</span><span>肩掛け</span><span>弁当収納</span>
    </div>
  </header>

  <main>
    <section class="baseline shell" aria-labelledby="baseline-title">
      <div class="section-heading">
        <p class="eyebrow">CURRENT</p>
        <h2 id="baseline-title">現在のバッグ</h2>
      </div>
      <div id="baselineCard"></div>
    </section>

    <section class="candidates shell" aria-labelledby="candidate-title">
      <div class="section-heading">
        <p class="eyebrow">CANDIDATES</p>
        <h2 id="candidate-title">候補</h2>
      </div>
      <div id="candidateList" class="card-list"></div>
    </section>

    <section class="comparison" aria-labelledby="comparison-title">
      <div class="shell">
        <div class="section-heading">
          <p class="eyebrow">SUMMARY</p>
          <h2 id="comparison-title">数字で比較</h2>
          <p>現在使用中を100として比較。</p>
        </div>
        <div id="loadChart" class="chart-card"></div>
        <div id="weightChart" class="chart-card"></div>
      </div>
    </section>

    <section class="method shell">
      <details>
        <summary>体感負荷の算出方法</summary>
        <div class="method-body">
          <p>固定荷物2,147g（弁当687g、水筒850g、財布・ポーチ等610g）を加えた通勤総重量から算出。現在使用中を100とした相対値です。</p>
        </div>
      </details>
    </section>
  </main>

  <footer class="footer shell">
    <p>商品仕様・画像はブランド公式サイト、WORLD ONLINE STORE、WEARなどの公開情報を参照しています。</p>
  </footer>

  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="商品画像を拡大表示">
    <button class="lightbox-close" type="button" aria-label="閉じる">×</button>
    <div class="lightbox-stage"><img id="lightboxImage" alt="" draggable="false"></div>
    <p class="lightbox-hint">2本指で拡大できます</p>
  </div>
</body>
</html>
